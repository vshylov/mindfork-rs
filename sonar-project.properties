# SonarQube Cloud project configuration (CI-based analysis, .github/workflows/ci.yml
# job `sonar`). The project is imported from GitHub, so the key follows the
# standard `<organization>_<repository>` scheme.
#
# NOTE: Automatic Analysis must stay OFF for this project (Administration ->
# Analysis Method). CI-based analysis refuses to run while it is enabled.
sonar.projectKey=vshylov_mindfork-rs
sonar.organization=vshylov

# What is analyzed. The Rust unit tests live inline in `src` (`#[cfg(test)]`), so
# they cannot be split out into `sonar.tests` — `tests/` holds only fixtures.
# `tools/` is our own Python (the CI gates, the remote e2e runner) and is worth
# analyzing; `build.rs` compiles the vendored syntax grammars.
sonar.sources=src,build.rs,tools
sonar.sourceEncoding=UTF-8

# The analyzer finds the crate through the manifest rather than through the
# indexed sources, and `Cargo.toml` is not itself in `sonar.sources` — stated
# explicitly so the Clippy run cannot silently find nothing.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Vendored third-party assets and generated/binary data: not ours to fix.
# `syntaxes/` are upstream Sublime grammars (docs/history/vendored-syntaxes.md),
# `dictionaries/` are Hunspell pairs, `tests/fixtures/` are deliberately
# malformed inputs.
sonar.exclusions=target/**,syntaxes/**,dictionaries/**,tests/fixtures/**,tools/__pycache__/**

# Coverage produced by `cargo llvm-cov` in the same job. Paths inside the report
# are relative to the workspace root, which is where the scanner runs.
sonar.rust.lcov.reportPaths=lcov.info
