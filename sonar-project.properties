# SonarQube Cloud project configuration (CI-based analysis, .github/workflows/ci.yml
# job `sonar`). The project is imported from GitHub, so the key follows the
# standard `<organization>_<repository>` scheme.
#
# NOTE: Automatic Analysis must stay OFF for this project (Administration ->
# Analysis Method). CI-based analysis refuses to run while it is enabled.
sonar.projectKey=vshylov_mindfork-rs
sonar.organization=vshylov

# What is analyzed. The Rust unit tests live inline in `src` (`#[cfg(test)]`), so
# they cannot be split out into `sonar.tests` — `tests/` holds only fixtures.
# `tools/` is our own Python (the CI gates, the remote e2e runner) and is worth
# analyzing; `build.rs` compiles the vendored syntax grammars.
sonar.sources=src,build.rs,tools
sonar.sourceEncoding=UTF-8

# Without this the Python analyzer assumes "all of Python 3" and says so in a
# WARN on every scan. The list is what actually runs `tools/*.py`: 3.10 on the
# development machine, 3.12 on the ubuntu-24.04 runner (the `lint` job calls
# them as `python3`).
sonar.python.version=3.10, 3.11, 3.12

# The analyzer finds the crate through the manifest rather than through the
# indexed sources, and `Cargo.toml` is not itself in `sonar.sources` — stated
# explicitly so the Clippy run cannot silently find nothing.
sonar.rust.cargo.manifestPaths=Cargo.toml

# Vendored third-party assets and generated/binary data: not ours to fix.
# `syntaxes/` are upstream Sublime grammars (docs/history/vendored-syntaxes.md),
# `dictionaries/` are Hunspell pairs, `tests/fixtures/` are deliberately
# malformed inputs.
sonar.exclusions=target/**,syntaxes/**,dictionaries/**,tests/fixtures/**,tools/__pycache__/**

# `rust:S2208` (wildcard import) off in the god-object splits, and only there.
#
# `use super::*` at the top of these files is the documented convention of the
# split playbook (docs/history/refactoring-god-objects.md, architecture.md §3):
# a split file is a *chapter* of one module, not an independent one, and
# re-importing its parent's names by hand would be a tax paid on every edit for
# no reader's benefit. The 2026-08-06 triage Accepted the 49 instances then
# existing one at a time — which does not scale, as `screens/chat/commands.rs`
# proved on 2026-08-15: a new chapter raises the rule again, and the standing
# decision has to be re-applied by hand each time.
#
# Scoped to the six directories that actually are splits (34 files), so a
# wildcard import anywhere else in `src/` is still a finding. `*.rs` rather than
# `**/*.rs` deliberately: `screens/chat/` has no nested modules today, and a
# future one should have to argue for itself. Test modules need no entry when
# they are named `tests` — an inline `#[cfg(test)] mod tests`, a `tests.rs`, and
# the files under a `tests/` directory such as `app/orchestrator/tests/`. Any
# other name is not exempt, `*_tests.rs` included: `app/supervisor/live_tests.rs`
# was flagged for its `use super::*` on pull request #673, so a test file named
# that way imports by name, as the other `*_tests.rs` files do.
# (`app/runtime/small_window_tests.rs` is covered by the split entry below, not
# by its name.) Nor is the name enough for an inline module without its own
# `#[cfg(test)]`: `features/demo/ru.rs` is test-only as a whole (declared under
# the attribute in `features/demo.rs`), its `mod tests` carried none, and its
# `use super::*` was flagged on `main` in 2026-10 — it imports by name now.
#
# Settable here because this project analyzes from CI; it is *Automatic
# Analysis* that cannot read these (see the note at the top of this file, which
# is also why it must stay off).
sonar.issue.ignore.multicriteria=split_runtime,split_chat,split_settings,split_notes,split_markdown,split_db,sitemap_ns
sonar.issue.ignore.multicriteria.split_runtime.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_runtime.resourceKey=src/app/runtime/*.rs
sonar.issue.ignore.multicriteria.split_chat.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_chat.resourceKey=src/screens/chat/*.rs
sonar.issue.ignore.multicriteria.split_settings.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_settings.resourceKey=src/screens/settings/*.rs
sonar.issue.ignore.multicriteria.split_notes.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_notes.resourceKey=src/features/tools/notes/*.rs
sonar.issue.ignore.multicriteria.split_markdown.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_markdown.resourceKey=src/shared/markdown/*.rs
sonar.issue.ignore.multicriteria.split_db.ruleKey=rust:S2208
sonar.issue.ignore.multicriteria.split_db.resourceKey=src/shared/storage/db/*.rs

# `python:S5332` (clear-text protocol) off in `tools/indexnow.py`, and only
# there.
#
# The flagged string is an XML namespace URI:
#
#     SITEMAP_NS = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
#
# Nothing is fetched over it. It is an identifier fixed by the sitemap 0.9
# specification, and it has to match the document byte for byte: rewritten to
# `https` it stops matching, `findall(".//sm:loc", SITEMAP_NS)` returns
# nothing, and a deploy would submit an empty URL list while reporting
# success. The same shape as the 2026-08-06 triage's `python:S5332` on
# `link_check.py:49` — the `SKIP_SCHEME` tuple used to *skip* external links,
# not to request one — which was marked False Positive in the UI. This one is
# written down here instead, for the reason the S2208 note above already
# measured: a UI Accept has to be re-applied by hand every time the line moves.
#
# What it costs, stated so it is not forgotten: `resourceKey` has no line
# granularity, so the rule is off for the whole file and a genuine clear-text
# URL added to it later would go unreported. The one that would matter is
# `ENDPOINT`, the single address this tool actually posts to — so
# `_check_endpoint` in its `--self-test` asserts that it is https, and that
# runs in the `lint` job on every pull request. The guarantee is enforced,
# not merely intended.
sonar.issue.ignore.multicriteria.sitemap_ns.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.sitemap_ns.resourceKey=tools/indexnow.py

# Coverage produced by `cargo llvm-cov` in the same job. Paths inside the report
# are relative to the workspace root, which is where the scanner runs.
sonar.rust.lcov.reportPaths=lcov.info

# `tools/` is Python and the coverage report is Rust-only, so every line of it
# lands in the denominator as uncovered — ~1240 lines dragging the reported
# figure down for files that have no test harness by design (they are verified
# by the offline probes described in the journal, not by a suite). Excluded from
# *coverage* only: they stay in `sonar.sources` and keep being analyzed for
# issues. This is about the measurement meaning what people read it to mean. It
# was written while the quality gate did not judge coverage; the gate does again
# (below), so the exclusion now also decides something: a script added to
# `tools/` does not count against its pull request's new-code coverage.
sonar.coverage.exclusions=tools/**

# Wait for the server to finish processing the report and fail the job if the
# quality gate fails. This closes a gap seen for real on the very first run: the
# scanner's `ANALYSIS SUCCESSFUL` only means *uploaded*, processing is
# asynchronous, and a report the server later rejected (it was over the
# organization's LOC quota) left the job green. Waiting makes the job answer
# "was this analysis accepted and did it pass", not merely "did the scan run".
# The gate judges *new* code, so existing findings never block a PR.
#
# **Which gate that is** is set on the server, not in this file — and it is the
# built-in `Sonar way`, all six conditions: the three ratings on new code,
# duplication on new code <= 3 %, security hotspots reviewed, and **coverage on
# new code >= 80 %**. Read off the server on 2026-09-29: the organization lists
# two gates with the built-in as its default, and the project's own status
# carries the coverage condition.
#
# This paragraph used to say otherwise, and what it said was true when written.
# On 2026-08-06 the project was put on a custom gate, "Sonar way without
# new-code coverage" — the same conditions minus that one — after three of four
# correct, issue-free refactoring PRs failed on it alone: extraction rewrites
# lines, so long-uncovered branches stop being "old code" and start counting,
# and complexity concentrates where unit tests cannot reach (docs/journal/
# quality.md, "the quality gate stopped judging new-code coverage"). That gate
# still exists on the server. It is no longer the one applied: pull request
# #611 was red on coverage on 2026-09-21 (76.1 %), #645 on 2026-09-29 (77.3 %),
# each with nothing else wrong. When the project went back to the default, and
# why, is recorded nowhere in this repository; putting it on the custom gate
# again is a project setting on the server.
#
# What the coverage condition means here, while it stands:
#
# - It is measured by the unit run. `#[ignore]` live smokes do not execute
#   under `cargo llvm-cov`, so the network, audio and terminal paths they cover
#   read as uncovered; keep the part of a new feature that decides something
#   in functions a unit test can call.
# - **A file of live smokes has to be named as a test file.** The report leaves
#   out what it takes for one by its path — a `tests/` directory, a name ending
#   in `tests.rs` — and counts every other file of the test binary as
#   production code. `gateway_live.rs` was 352 lines at 0 % and took #645 under
#   the floor by itself; as `gateway_live_tests.rs` it is not in the report.
# - The figure can be rehearsed before the push: `cargo llvm-cov --workspace
#   --lcov --output-path lcov.info`, the lines `git diff -U0 <base>` adds, their
#   intersection. It came out at 77.7 % where the server said 77.3 %, and it
#   names the lines.
sonar.qualitygate.wait=true
