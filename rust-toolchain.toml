# Пин тулчейна (release-engineering.md, Ф4). Причина: гейт
# `cargo clippy --all-targets -- -D warnings` каждый новый stable ломал бы
# внезапно новыми линтами. С пином обновление тулчейна — осознанный отдельный PR
# («поднять до 1.NN», чинящий новые линты), как обновление любой зависимости.
# Edition 2024 требует ≥ 1.85; пин совпадает с версией разработки.
[toolchain]
channel = "1.96.0"
components = ["rustfmt", "clippy"]
