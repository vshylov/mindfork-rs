# An nfpm config for Linux packages: one file → deb + rpm + archlinux (.pkg.tar.zst)
# via `nfpm package --packager deb|rpm|archlinux`. Layout — §4.2
# docs/history/installers.md.
#
# Key point: the real binary is placed NOT in /usr/bin (you can't put adjacent
# data there — FHS/Debian Policy), but in /usr/lib/mindfork-rs/ next to defaults.json and
# the dictionaries; a symlink leads there from /usr/bin. `std::env::current_exe()` on Linux
# resolves the symlink to the real path (/proc/self/exe), so the app finds its
# neighboring resources — no code changes needed. With mode=system, dictionaries are
# absent from the data directory → they're taken from /usr/lib/mindfork-rs/data/dictionaries (fallback P1).
#
# The version and the binary path are substituted by packaging/linux/build-packages.sh via env.
#
# Naming: the command is the brand `mindfork`; the package and its /usr/lib
# directory keep the project name `mindfork-rs` (docs/research/binary-rename.md).
name: mindfork-rs
arch: amd64
platform: linux
version: "${VERSION}"
release: "1"
section: utils
priority: optional
maintainer: "Vladimir Shylov <vladimir.shylov@outlook.com>"
vendor: "Vladimir Shylov"
# Becomes deb `Homepage:` / rpm `URL:` / pacman `url`. The project site; the
# repository stays reachable from the shipped README in /usr/share/doc.
homepage: "https://mindfork.io"
license: "MIT"
description: |
  Console (TUI) AI chat application.
  Local models (Gemma/Qwen via llama.cpp) and cloud providers (OpenAI,
  Gemini, Anthropic). Notes/RAG memory, client-side tools, multi-language UI.

# Dependencies are set by hand — nfpm doesn't compute them. Stack: rustls (no OpenSSL) +
# bundled SQLite + x11rb (clipboard) → from the system, only glibc and ALSA remain
# (libasound — speech playback `/tts`; on PipeWire/PulseAudio it works via the
# standard pipewire-alsa). The app doesn't crash without audio: the `/tts` command will show
# "audio unavailable" (docs/research/tts.md §6).
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      # The alternative is required, not cosmetic: after the time_t64 transition
      # (Ubuntu 24.04+/Debian trixie) the real ALSA is named `libasound2t64`, while
      # the old name `libasound2` remains only **virtual** — and apt satisfies it with
      # the OSS shim `liboss4-salsa-asound2`, which lacks some symbols
      # (`snd_device_name_get_hint`), i.e. the app crashes at startup. Caught by
      # packaging.yml's container smoke on ubuntu:24.04. The first alternative
      # is preferred, on older systems (bookworm) the second one remains.
      - libasound2t64 | libasound2
  rpm:
    depends:
      - alsa-lib
  archlinux:
    depends:
      - alsa-lib
  # glibc in rpm/archlinux is part of the base system, not specified explicitly.

contents:
  # The real binary (a sidecar in /usr/lib/<pkg>/, not in /usr/bin).
  - src: ./dist/stage/mindfork
    dst: /usr/lib/mindfork-rs/mindfork
    file_info:
      mode: 0755

  # The vendor's install default: data goes into the standard OS user folder
  # (~/.local/share/mindfork-rs). config|noreplace → a user's edit survives an
  # upgrade (deb-conffile / rpm %config(noreplace) / pacman backup).
  - src: ./packaging/linux/defaults.json
    dst: /usr/lib/mindfork-rs/defaults.json
    type: "config|noreplace"
    file_info:
      mode: 0644

  # Spellcheck dictionaries (a portable layout next to the binary — the P1 fallback).
  - src: ./dictionaries/*.aff
    dst: /usr/lib/mindfork-rs/data/dictionaries/
    file_info:
      mode: 0644
  - src: ./dictionaries/*.dic
    dst: /usr/lib/mindfork-rs/data/dictionaries/
    file_info:
      mode: 0644
  # Their licences travel with them: the dictionaries are third-party work under
  # BSD-style and LGPL terms, both of which require the notice to accompany a
  # redistribution (dictionaries/SOURCES.md).
  - src: ./dictionaries/licenses/*.txt
    dst: /usr/lib/mindfork-rs/data/dictionaries/licenses/
    file_info:
      mode: 0644

  # The user-facing entry point: a symlink from PATH to the real binary.
  - src: /usr/lib/mindfork-rs/mindfork
    dst: /usr/bin/mindfork
    type: symlink

  # The application-menu entry. Terminal=true is mandatory — the app is a TUI
  # (see docs/branding.md §4.2). Exec refers to the symlink on PATH.
  - src: ./packaging/linux/mindfork.desktop
    dst: /usr/share/applications/mindfork.desktop
    file_info:
      mode: 0644

  # hicolor theme icons. The file name must match the Icon= key in the .desktop
  # (mindfork), so the source files are renamed on install.
  # We don't add cache-refresh scriptlets: both Debian (the update-icon-caches
  # trigger) and Fedora (a file trigger on /usr/share/icons/hicolor) do it themselves.
  - src: ./assets/mindfork-icon-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/mindfork.png
    file_info:
      mode: 0644
  - src: ./assets/mindfork-icon-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/mindfork.png
    file_info:
      mode: 0644
  - src: ./assets/mindfork-icon-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/mindfork.png
    file_info:
      mode: 0644
  - src: ./assets/mindfork-icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/mindfork.png
    file_info:
      mode: 0644
  - src: ./assets/mindfork-icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/mindfork.png
    file_info:
      mode: 0644
  - src: ./assets/mindfork-icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/mindfork.png
    file_info:
      mode: 0644
  # The vector variant — with a backdrop, like the raster ones (a consistent look in the menu).
  - src: ./assets/mindfork-icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/mindfork.svg
    file_info:
      mode: 0644

  # Documentation.
  - src: ./README.md
    dst: /usr/share/doc/mindfork-rs/README.md
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/mindfork-rs/CHANGELOG.md
  - src: ./LICENSE
    dst: /usr/share/doc/mindfork-rs/LICENSE
  # Ships next to the license it supplements: the model-output disclaimer is
  # only useful if it reaches the machine the model runs on.
  - src: ./DISCLAIMER.md
    dst: /usr/share/doc/mindfork-rs/DISCLAIMER.md
  # The Russian translations of both (docs/history/legal-ru-translations.md). Unofficial
  # — each says so in its own first paragraph — so they sit beside the originals
  # rather than replacing them for a ru system.
  - src: ./docs/legal/LICENSE.ru.txt
    dst: /usr/share/doc/mindfork-rs/LICENSE.ru.txt
  - src: ./docs/legal/DISCLAIMER.ru.md
    dst: /usr/share/doc/mindfork-rs/DISCLAIMER.ru.md
  - src: ./docs/install.md
    dst: /usr/share/doc/mindfork-rs/install.md
