# cargo-about configuration: the third-party notice file that travels with every
# release artifact (docs/research/release-pipeline.md R2). Generated by
# `cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md` in release.yml, and
# by packaging.yml on any pull request that changes the dependency graph — so a
# licence the list cannot account for fails on the pull request rather than on
# the tag.
#
# The file is NOT committed: it is derived from the locked graph, and the copy
# that matters is the one built from the exact `Cargo.lock` of the release.

# Both shipped targets, so a Windows-only or Linux-only dependency is not
# silently dropped from the notices of the artifact that contains it.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Build-only dependencies do not travel in the binary; `cc`, `winresource` and
# friends have no notice obligation towards a user who receives the artifact.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# A crate that states no licence at all is an error, not a blank line: the
# obligation is exactly what this file exists to satisfy.
workarounds = ["ring"]

# The licences we are prepared to redistribute under — the same list `deny.toml`
# enforces for the graph, minus the ones no dependency uses. Anything outside it
# stops the generation.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
