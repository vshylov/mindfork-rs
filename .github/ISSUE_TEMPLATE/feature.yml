name: Idea or feature request
description: Something the app should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. [docs/roadmap.md](https://github.com/vshylov/mindfork-rs/blob/main/docs/roadmap.md)
        shows what is already on the list — including things that were considered
        and deliberately left out, with the reason.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The situation, not the solution. What were you doing when the app got in
        the way, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: If you already have a shape in mind, describe it here.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: >
        A workaround that almost works often says more about the right answer
        than the request does.
