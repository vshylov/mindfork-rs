# The tools that draw the project's pictures - tools/screenshots.py, and
# tools/demo_reel.py over its cell renderer - checked on a pull request that
# changes them.
#
# Neither tool runs in ci.yml: the stills are regenerated by hand when the
# dumps move, and the animation is drawn on a release (release.yml's
# `demo-reel`). So a change to the renderer was seen first in a published
# picture - which is where the lines between the rows of every solid bar were
# found (docs/journal/release.md, "block elements drawn as parts of their
# cells"). What the renderer decides without a typeface is checked here, with
# the packages the release draws with: which part of its cell each block
# element fills, and that a bar of them is one colour from its first row to
# its last.
name: Media tools

on:
  pull_request:
    paths:
      - "tools/screenshots.py"
      - "tools/demo_reel.py"
      - "tools/media-requirements.txt"
      - ".github/workflows/media-tools.yml"
  # Deliberately no `push: [main]` trigger, for packaging.yml's reason: the
  # pull_request run validates the merge result for exactly these paths.
  workflow_dispatch:

concurrency:
  group: media-tools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arms:
    name: The cell renderer's own arms
    runs-on: ubuntu-24.04
    # A Python, three wheels and a second of drawing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The Python the release draws with (release.yml's `demo-reel`): the
      # newest the requirements file's hashes name.
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # Exact versions, and only the wheels the file's hashes name.
      - name: Python packages (hash-pinned)
        timeout-minutes: 5
        run: python3 -m pip install --require-hashes -r tools/media-requirements.txt
      - name: Block elements are parts of their cells
        run: python3 tools/screenshots.py --self-test
