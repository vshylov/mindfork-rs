# The live e2e gate: the `#[ignore]` smokes against a real llama.cpp server,
# rented for the duration of the run as an HF Inference Endpoint.
#
# `workflow_dispatch` only, deliberately (research R5a): a live run is a
# considered act (AGENTS.md §3), it costs about $3 for the whole suite, and some
# of the smokes touch the real internet, so running it on every push would buy
# flakes rather than signal. It is also, by that same trigger, restricted to
# people with write access — which is why HF_TOKEN is a plain repository secret
# rather than an environment with reviewers (R8).
#
# The suite is **sharded** (docs/research/e2e-gate-budget.md): 250 smokes, up
# from 66 in July, are 50–60 minutes on one L40S, and the job's ceiling cannot
# rise without crowding the sweeper's threshold. Each shard is a job of its own
# with endpoints of its own; billing is per minute, so N shards cost about one
# run plus N-1 deploys, and finish in about 1/N of the time.
#
# Everything except the trigger lives in tools/e2e_hf.py, so the same command
# runs here and on a developer's machine. See docs/history/remote-e2e-hf.md §6.
name: Live e2e (HF Inference Endpoints)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "cargo test name filter (empty = the whole suite)"
        required: false
        default: ""
      # One dispatch, one model (docs/history/e2e-second-chat-model.md, fork
      # F2): both families in one dispatch would run the suite twice.
      #
      # `gpt-oss-120b` is the third: a **split** model (two files, 63.39 GB), an
      # OpenAI open-weights model (the harmony template), and the only text-only
      # one — so it brings its own GPU (H200 141 GB, us-west-2), its own download
      # filter and a declared skip for the three vision smokes, all from its
      # record in tools/hf_api.py. It costs about three times a Gemma dispatch;
      # docs/research/e2e-gpt-oss-120b.md.
      model:
        description: "Chat model to rent for this run"
        required: false
        default: gemma-4-31b
        type: choice
        options: [gemma-4-31b, qwen-3.6-27b, gpt-oss-120b]
      # `model-default` is the normal answer: the model record names the card that
      # fits it, and the region follows the card. Overriding it is for measuring a
      # cheaper instance, not for routine use — a 63 GB model on a 48 GB L40S
      # fails after the deploy, not before it.
      chat_instance:
        description: "GPU for the chat endpoint (model-default = the model's own)"
        required: false
        default: model-default
        type: choice
        options: [model-default, nvidia-l40s, nvidia-a10g, nvidia-l4, nvidia-a100, nvidia-h200]
      # Four by default. Measured on run 37970393128, the first to finish the
      # whole suite: 72 minutes of smokes, and the heaviest of four round-robin
      # shards ~28 of them (the steering probe alone is 12). Each shard holds an
      # L40S and two T4s (quota: 16 and 30), and more shards at once meet more of
      # HF's capacity refusals — 8 of 13 L40S creates failed to start that
      # evening. `1` is the whole suite in one job, as before; a filtered run is
      # sharded too, so pick `1` for a handful of smokes. A shard that fails is
      # rerun alone: `gh run rerun <id> --failed`.
      shards:
        description: "Parallel jobs the suite is dealt across, each with endpoints of its own"
        required: false
        default: "4"
        type: choice
        options: ["4", "1", "2", "3", "5", "6"]
      no_embed:
        description: "Skip the embedding endpoints (the memory smokes then skip too)"
        required: false
        default: false
        type: boolean
      no_alt_embed:
        description: "Skip the second embedding model (the 4 model-change smokes then skip)"
        required: false
        default: false
        type: boolean

# One live run at a time — but never cancel one in flight: a cancelled run is a
# wasted deploy, and the endpoints it is holding are real money. The shards of
# one run are jobs of that run, so they run side by side.
concurrency:
  group: e2e-live
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: Live smokes (${{ matrix.shard }}/${{ inputs.shards }})
    runs-on: ubuntu-latest
    strategy:
      # A red shard must not cancel its siblings: each holds endpoints of its
      # own and reports on smokes no other shard runs.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(format('[{0}]', inputs.shards == '1' && '1' || inputs.shards == '2' && '1,2' || inputs.shards == '3' && '1,2,3' || inputs.shards == '5' && '1,2,3,4,5' || inputs.shards == '6' && '1,2,3,4,5,6' || '1,2,3,4')) }}
    # Budget per shard, measured on 2026-10-09: build and test list ~5 min,
    # endpoints ready in 2–18 min (HF schedules the cards as it can), and the
    # shard's part of a ~70-minute suite — up to ~28 min. 45 held the suite but
    # not a slow schedule on top of it, hence 60. The number itself is
    # load-bearing in one direction: it must stay **below the sweeper's
    # 90-minute threshold**, or the sweeper could delete the endpoints
    # of a run that is still using them (`tools/e2e_hf.py --self-test` checks
    # it). On timeout the job is cancelled: the runner — `exec`ed below, so the
    # signal is its own — deletes its endpoints, and the backstop step at the end
    # deletes whatever it did not. The 15-minute scale-to-zero window bounds the
    # cost if even both fail.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # Bounded (timeout + apt options) — see the comment on ci.yml's `lint` job.
      # Runs before any endpoint exists, so a failure here bills no GPU.
      - name: System dependencies (ALSA — speech playback /tts)
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          && sudo apt-get install -y libasound2-dev

      # The two MCP smokes spawn `npx @modelcontextprotocol/server-filesystem`.
      # Its first run on a cold npm cache can exceed the 120 s readiness timeout
      # (recorded in docs/journal/i18n.md), so warm it here rather than letting
      # it fail inside the suite while the GPU bills.
      - name: Warm the npm cache (MCP smokes)
        run: |
          node --version && npx --version
          npx --yes @modelcontextprotocol/server-filesystem --help >/dev/null 2>&1 || true

      # Inputs go through the environment, never interpolated into the script:
      # `${{ inputs.filter }}` inside a `run:` is a shell-injection shape, and
      # "only people with write access can dispatch it" is not the layer that
      # should be holding that.
      #
      # The runner is `exec`ed. A cancellation — a timeout is one — signals the
      # step's own process and no other: before the `exec`, that was this bash,
      # and the Python runner under it never heard of it. CI run 37947267239 hit
      # the timeout, bash died, and the runner was killed as an orphan at the end
      # of the job with all three endpoints still running.
      #
      # The shard is always passed: `1/1` is the whole suite under the names an
      # unsharded run has always had.
      - name: Run the suite against fresh endpoints
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FILTER: ${{ inputs.filter }}
          CHAT_INSTANCE: ${{ inputs.chat_instance }}
          CHAT_MODEL: ${{ inputs.model }}
          NO_EMBED: ${{ inputs.no_embed }}
          NO_ALT_EMBED: ${{ inputs.no_alt_embed }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          args=(run --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --shard "${SHARD}/${SHARDS}")
          # Unset means "the model's own", which is also what picks its region.
          if [ -n "$CHAT_INSTANCE" ] && [ "$CHAT_INSTANCE" != "model-default" ]; then
            args+=(--chat-instance "$CHAT_INSTANCE")
          fi
          if [ -n "$CHAT_MODEL" ]; then args+=(--chat-model "$CHAT_MODEL"); fi
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          if [ "$NO_EMBED" = "true" ]; then args+=(--no-embed); fi
          if [ "$NO_ALT_EMBED" = "true" ]; then args+=(--no-alt-embed); fi
          exec python3 tools/e2e_hf.py "${args[@]}"

      # The backstop. The runner deletes its own endpoints from `finally`,
      # `atexit` and its signal handler — while it is alive to. This step needs
      # nothing from the one before but the run id and the shard: the names are
      # derived from them exactly as the create derived them, only those names
      # are deleted — never a sibling shard's, which may still be running — and
      # the deletion is verified (exit 3 if not). It then lists what is left in
      # the namespace — all this step did until CI run 37947267239 showed three
      # endpoints still running here and nothing deleting them.
      - name: Delete this shard's endpoints (backstop)
        if: always()
        timeout-minutes: 5
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: python3 tools/e2e_hf.py delete-run --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --shard "${SHARD}/${SHARDS}"
