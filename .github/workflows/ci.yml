# CI: lints (source language + doc links + fmt + clippy) on Linux + tests on
# Linux and Windows.
# The toolchain comes from rust-toolchain.toml (a pin, release-engineering.md F4).
# #[ignore] smokes (engine/network/live model) without env variables are silently skipped —
# CI needs no network or a live server. See docs/release-engineering.md §3.3.
#
# Runner minutes: the full matrix runs on pull requests (the real gate); the
# push-to-main run is trimmed to Linux — see the comment on the matrix below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous runs on the same ref (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the expensive `test` job can be skipped. Only ever says
  # "docs only" for a pull request; every other event runs the tests.
  #
  # The allowlist is deliberately narrow — an *allowlist*, so anything new or
  # unrecognized falls through to running the tests. Files that look like docs
  # but are read by the build or by a gate test, and therefore must NOT be in
  # it: LICENSE (include_str! in shared/credits.rs), artwork/*.svg (parsed by
  # the widgets/logo.rs gate), locales/*.json (include_str! + the i18n gates),
  # Cargo.toml / Cargo.lock (the credits gates), tools/, packaging/,
  # dictionaries/, tests/fixtures/ and .github/ itself.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Classify the changed files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Fail-safe helper: any doubt at all -> run the tests.
          run_tests() { echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "${{ github.event_name }}" = "pull_request" ] || run_tests

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') || run_tests
          [ -n "$files" ] || run_tests

          # Guard against a truncated listing: the API caps the file list, and a
          # partial page could hide a source file and wrongly look docs-only.
          expected=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files') || run_tests
          actual=$(printf '%s\n' "$files" | wc -l)
          [ "$expected" = "$actual" ] || run_tests

          echo "Changed files ($actual):"
          printf '  %s\n' $files

          # docs/** and top-level *.md only. `grep -v` finds anything outside
          # the allowlist; a hit means real code changed.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "-> source changes present, running the tests"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "-> documentation only, skipping the tests"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lints (source language + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source language is English (CLAUDE.md/AGENTS.md §Conventions); this
      # guard fails on Cyrillic outside its allowlist (the `ru` locale bundle,
      # dictionaries, in-test fixtures, intentional `[ru]`/`ru.` localization).
      # Runs before the Rust setup — it needs neither the toolchain nor ALSA.
      - name: Source language (no untranslated Russian)
        run: python3 tools/cyrillic_scan.py
      # A stale relative link is valid Markdown, so nothing else notices it —
      # it only 404s when someone clicks it on GitHub. The dominant cause is
      # procedural: AGENTS.md §4 moves a finished plan into docs/history/, the
      # file gains a directory level, and every relative link inside it breaks
      # (one archived plan had 23). Also needs no toolchain, so it runs here.
      - name: Documentation links resolve
        run: python3 tools/link_check.py --list
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (ALSA — speech playback /tts)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    needs: changes
    # Two independent guards, because they cover different failures:
    #   * `!= 'true'` (not `== 'false'`) covers the *value* — a missing or empty
    #     output must still run the tests.
    #   * `!cancelled()` covers the *job*. A failed `needs` dependency skips the
    #     dependent job outright, whatever `if` says, so without this a broken
    #     `changes` job silently skips the test gate. Not hypothetical: that is
    #     exactly what happened in run 30217314709, where `changes` could not
    #     start and `Tests` came out "skipped".
    # `!cancelled()` rather than `always()`: cancelling the workflow must still
    # cancel this job.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Both OSes on a pull request; on `main` — Linux only. GitHub runs
        # `pull_request` against the *merge result* (`refs/pull/N/merge`), so the
        # push-to-main run re-tests code that has already passed, and
        # `windows-latest` bills at 2x (~16 of the 20 billable minutes per run).
        # The Linux run is kept on `main` so the README badge stays live and a
        # semantic conflict between two separately-green PRs is still caught.
        os: >-
          ${{ github.event_name == 'push'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # ALSA is only needed for the Linux build (rodio/cpal); on Windows — pure windows-rs.
      - name: System dependencies (ALSA — speech playback /tts)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests
        run: cargo test
