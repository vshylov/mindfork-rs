# CI: lints (source language + fmt + clippy) on Linux + tests on Linux and Windows.
# The toolchain comes from rust-toolchain.toml (a pin, release-engineering.md F4).
# #[ignore] smokes (engine/network/live model) without env variables are silently skipped —
# CI needs no network or a live server. See docs/release-engineering.md §3.3.
#
# Runner minutes: the full matrix runs on pull requests (the real gate); the
# push-to-main run is trimmed to Linux — see the comment on the matrix below.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous runs on the same ref (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lints (source language + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source language is English (CLAUDE.md/AGENTS.md §Conventions); this
      # guard fails on Cyrillic outside its allowlist (the `ru` locale bundle,
      # dictionaries, in-test fixtures, intentional `[ru]`/`ru.` localization).
      # Runs before the Rust setup — it needs neither the toolchain nor ALSA.
      - name: Source language (no untranslated Russian)
        run: python3 tools/cyrillic_scan.py
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (ALSA — speech playback /tts)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both OSes on a pull request; on `main` — Linux only. GitHub runs
        # `pull_request` against the *merge result* (`refs/pull/N/merge`), so the
        # push-to-main run re-tests code that has already passed, and
        # `windows-latest` bills at 2x (~16 of the 20 billable minutes per run).
        # The Linux run is kept on `main` so the README badge stays live and a
        # semantic conflict between two separately-green PRs is still caught.
        os: >-
          ${{ github.event_name == 'push'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # ALSA is only needed for the Linux build (rodio/cpal); on Windows — pure windows-rs.
      - name: System dependencies (ALSA — speech playback /tts)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Tests
        run: cargo test
