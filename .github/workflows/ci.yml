# CI: lints (source language + doc links + fmt + clippy) on Linux + tests on
# Linux and Windows + SonarQube Cloud analysis (advisory) on Linux.
# The toolchain comes from rust-toolchain.toml (a pin, release-engineering.md F4).
# #[ignore] smokes (engine/network/live model) without env variables are silently skipped —
# CI needs no network or a live server. See docs/release-engineering.md §3.3.
#
# Runner minutes: the full matrix runs on pull requests (the real gate); on
# push-to-main the Windows entry only builds, to leave a warm cache behind —
# see the comment on the matrix below. Measured on the first such run: 9m31s of
# build plus 1m06s to save, i.e. ~19 billable minutes per merge (Windows bills at
# 2x), buying back the ~7.5 minutes of cold compile every pull request used to
# pay. That is the trade this workflow deliberately makes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel previous runs on the same ref (saves runner minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether the expensive `test` job can be skipped. Only ever says
  # "docs only" for a pull request; every other event runs the tests.
  #
  # The allowlist is deliberately narrow — an *allowlist*, so anything new or
  # unrecognized falls through to running the tests. Files that look like docs
  # but are read by the build or by a gate test, and therefore must NOT be in
  # it: LICENSE (include_str! in shared/credits.rs), artwork/*.svg (parsed by
  # the widgets/logo.rs gate), locales/*.json (include_str! + the i18n gates),
  # Cargo.toml / Cargo.lock (the credits gates), tools/, packaging/,
  # dictionaries/, tests/fixtures/ and .github/ itself.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # Reading the PR's file list needs `pull-requests: read`, which the default
    # GITHUB_TOKEN does not carry. Without this the API call 403s, the fail-safe
    # below runs the tests, and the whole optimization is silently inert — which
    # is exactly what happened until PR #230, the first genuinely docs-only PR,
    # made it visible. This job checks out nothing, so `contents: read` is all
    # it needs besides.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Classify the changed files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # Fail-safe helper: any doubt at all -> run the tests. It says *why*,
          # because a silent fallback is indistinguishable from a working
          # optimization: a missing `pull-requests: read` made this 403 and run
          # the tests every single time, and nothing said so until someone
          # opened a docs-only PR and wondered why the matrix still ran.
          run_tests() {
            echo "-> running the tests: ${1:-no reason given}"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          [ "${{ github.event_name }}" = "pull_request" ] || run_tests "not a pull request (${{ github.event_name }})"

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') \
            || run_tests "cannot read the PR file list (permissions? API error?)"
          [ -n "$files" ] || run_tests "the PR file list came back empty"

          # Guard against a truncated listing: the API caps the file list, and a
          # partial page could hide a source file and wrongly look docs-only.
          expected=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files') \
            || run_tests "cannot read the PR's changed_files count"
          actual=$(printf '%s\n' "$files" | wc -l)
          [ "$expected" = "$actual" ] || run_tests "listing truncated ($actual of $expected files)"

          echo "Changed files ($actual):"
          printf '  %s\n' $files

          # docs/** and top-level *.md only. `grep -v` finds anything outside
          # the allowlist; a hit means real code changed.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|[^/]+\.md$)'; then
            echo "-> source changes present, running the tests"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "-> documentation only, skipping the tests"
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lints (source language + fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The source language is English (CLAUDE.md/AGENTS.md §Conventions); this
      # guard fails on Cyrillic outside its allowlist (the `ru` locale bundle,
      # dictionaries, in-test fixtures, intentional `[ru]`/`ru.` localization).
      # Runs before the Rust setup — it needs neither the toolchain nor ALSA.
      - name: Source language (no untranslated Russian)
        run: python3 tools/cyrillic_scan.py
      # A stale relative link is valid Markdown, so nothing else notices it —
      # it only 404s when someone clicks it on GitHub. The dominant cause is
      # procedural: AGENTS.md §4 moves a finished plan into docs/history/, the
      # file gains a directory level, and every relative link inside it breaks
      # (one archived plan had 23). Also needs no toolchain, so it runs here.
      - name: Documentation links resolve
        run: python3 tools/link_check.py --list
      # The engineering journal moved out of CLAUDE.md into docs/journal/ so it
      # stops being auto-loaded into every session (~237K tokens spent before any
      # work began). That split rots silently: an entry appended without its index
      # bullet, a journal file nobody links to, a router creeping back towards a
      # megabyte. None of it breaks a build. Needs no toolchain, so it runs here.
      - name: Documentation structure (journal indexes + CLAUDE.md size)
        run: python3 tools/doc_index_check.py
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      # A cache belongs to the branch that wrote it, so with the default
      # `save-if: true` every PR branch stores its own 0.3-0.6 GB copy of the
      # same thing. The repository cap is 10 GB and it was already over it
      # (10.37 GB in 21 caches, five near-identical copies of one key), which
      # evicts by age — including the caches that matter — and turns later runs
      # cold: exactly the minutes this workflow is otherwise careful about.
      # Saving only from `main` keeps one copy per job; a pull request still
      # *restores* it, because GitHub lets a branch read its base branch's
      # caches.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies (ALSA — speech playback /tts)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy (all targets, warnings = errors)
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    needs: changes
    # Two independent guards, because they cover different failures:
    #   * `!= 'true'` (not `== 'false'`) covers the *value* — a missing or empty
    #     output must still run the tests.
    #   * `!cancelled()` covers the *job*. A failed `needs` dependency skips the
    #     dependent job outright, whatever `if` says, so without this a broken
    #     `changes` job silently skips the test gate. Not hypothetical: that is
    #     exactly what happened in run 30217314709, where `changes` could not
    #     start and `Tests` came out "skipped".
    # `!cancelled()` rather than `always()`: cancelling the workflow must still
    # cancel this job.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        # Both OSes on both events — but on `main` the Windows entry only
        # *builds* (see the `Tests` step). GitHub runs `pull_request` against the
        # *merge result*, so re-running the Windows suite on `main` would re-test
        # code that has already passed; what `main` is here for is to leave a
        # warm Windows cache behind, which is the single biggest cost on a pull
        # request (measured: 7m31s of cold compile out of a 19-minute job).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      # No Defender exclusions here, and that is a measured decision rather than
      # an oversight. The obvious theory for the runner being ~8x slower than a
      # local Windows box at the same four-thread parallelism (37s local against
      # 549s here) is real-time scanning of everything rustc writes — so the
      # exclusions were added, and then `Get-MpComputerStatus` reported
      # `RealTimeProtectionEnabled = False` on the runner image. Defender is
      # already off; excluding paths from a scanner that is not running buys
      # nothing, so the step was removed again. The residual gap is the runner's
      # CPU and disk. Do not re-add this without checking that flag first.
      # Save only from `main` (see the comment in `lint`). The Windows exception
      # that used to live here was worse than useless: `main` never built
      # Windows, so nothing was ever saved to a ref a pull request can read
      # (GitHub scopes a cache to the branch that wrote it, and only lets a
      # branch read its *base*). Every PR therefore paid a full cold build and
      # then spent 1m51s saving 445 MB to its own `refs/pull/N/merge`, which no
      # other run could ever restore and which dies with the PR.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ALSA is only needed for the Linux build (rodio/cpal); on Windows — pure windows-rs.
      - name: System dependencies (ALSA — speech playback /tts)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # On `main` the Windows entry builds without running: the suite already
      # passed on the pull request, and building is what fills the cache. This
      # keeps the same job id — and therefore the same rust-cache key, which
      # embeds it (`v0-rust-test-Windows_NT-…`) — so a pull request restores
      # exactly what `main` saved. A separate warming job would silently write a
      # different key and warm nothing.
      - name: Tests
        run: >-
          ${{ (github.event_name == 'push' && runner.os == 'Windows')
              && 'cargo test --no-run' || 'cargo test' }}

  # SonarQube Cloud analysis (project `vshylov_mindfork-rs`, configuration in
  # sonar-project.properties). The Sonar Rust analyzer runs `cargo clippy` itself
  # — hence the toolchain and ALSA here — and imports the LCOV report produced
  # right above it by `cargo llvm-cov`.
  #
  # Blocking: `sonar.qualitygate.wait` (sonar-project.properties) makes the
  # scanner wait for the server to process the report and fail on a failed gate.
  # It started advisory on purpose — a new analyzer on a 1833-test codebase can
  # surface a batch of findings at once — and was flipped once the first analyses
  # came back clean. The gate judges *new* code, so the existing backlog cannot
  # redden a PR; what can is new uncovered code, new issues, or an analysis the
  # server rejects (which used to pass silently).
  #
  # Runner minutes: reuses the `changes` gate, so a docs-only PR skips it (there
  # is no new code to analyze). The two builds it does (instrumented for
  # coverage, then plain for clippy) have different fingerprints, so both live in
  # this job's own cache.
  sonar:
    name: SonarQube Cloud
    needs: changes
    # Same two guards as `test`, for the same reasons (see the comment there).
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Sonar needs the full history: a shallow clone breaks blame, and with
          # it the "new code" detection every quality-gate condition is based on.
          fetch-depth: 0
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      # cargo-llvm-cov needs the LLVM tools; deliberately added here rather than
      # in rust-toolchain.toml, so a developer checkout does not download them.
      - name: LLVM tools (for cargo-llvm-cov)
        run: rustup component add llvm-tools-preview
      # Save only from `main` (see the comment in `lint`). This job's cache is
      # the largest of the three — it holds both the instrumented and the plain
      # build — so it is also the one that most needs to exist exactly once.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies (ALSA — speech playback /tts)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      # #[ignore] smokes stay skipped, exactly as in the `test` job — no network,
      # no live server, no cloud keys.
      - name: Coverage (LCOV)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
