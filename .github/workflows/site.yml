# mindfork.io: a build gate on pull requests, deploy on push to main.
# Design: docs/research/mindfork-io-website.md §5.5; infra (bucket,
# distribution, the OIDC deploy role) comes from the `mindfork-website`
# CloudFormation stack, infra/website.cfn.yaml.
#
# Zola is pinned (ZOLA_VERSION below) and must match local development: the site
# builds with one version everywhere, and 0.23 is a different language from 0.22
# (Tera 2 components instead of shortcodes, content templated). The binary is
# the upstream release asset, verified against its Sigstore/SLSA attestation
# (`gh attestation verify --owner getzola`) rather than installed through a
# third-party manifest that lags new tags by days. Bump here, in
# docs/research/mindfork-io-website.md §5.5 and on the developer machines.
#
# Deploys carry no stored keys: the job's OIDC token assumes the
# least-privilege mindfork-site-deploy role (s3 sync + one invalidation),
# trusted for refs/heads/main of this repository only.
name: Site

env:
  ZOLA_VERSION: "0.23.6"

on:
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "tools/site_sync_assets.py"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "tools/site_sync_assets.py"
      - ".github/workflows/site.yml"
  # Manual redeploy (e.g. after an infra change with no site diff).
  workflow_dispatch:

# Superseded PR builds are cancelled; deploys on main queue and never cancel
# each other mid-sync.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a `timeout-minutes` — the reasons, and the incident behind them,
# are in the header of ci.yml. Measured over 35 builds and 20 deploys: max 0.3 min;
# the Zola download, the S3 sync and the invalidation are the network parts.
jobs:
  build:
    name: Build (gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Zola ${{ env.ZOLA_VERSION }} (verified release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${ZOLA_VERSION}" --repo getzola/zola --pattern "$asset" --dir /tmp/zola
          gh attestation verify "/tmp/zola/$asset" --owner getzola
          tar -xzf "/tmp/zola/$asset" -C /tmp/zola
          sudo install -m 755 /tmp/zola/zola /usr/local/bin/zola
          zola --version
      - name: Mirror brand assets into site/static/
        run: python tools/site_sync_assets.py
      - name: Check internal links
        run: zola --root site check --skip-external-links
      - name: Build
        run: zola --root site build

  deploy:
    name: Deploy to mindfork.io
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token that assumes the deploy role
      contents: read
    env:
      # Outputs of the `mindfork-website` stack (infra/website.cfn.yaml).
      BUCKET: mindfork-website-sitebucket-ioafb7vyycso
      DISTRIBUTION: E8EC9ICZSRYKB
    steps:
      - uses: actions/checkout@v5
      - name: Install Zola ${{ env.ZOLA_VERSION }} (verified release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${ZOLA_VERSION}" --repo getzola/zola --pattern "$asset" --dir /tmp/zola
          gh attestation verify "/tmp/zola/$asset" --owner getzola
          tar -xzf "/tmp/zola/$asset" -C /tmp/zola
          sudo install -m 755 /tmp/zola/zola /usr/local/bin/zola
          zola --version
      - name: Mirror brand assets into site/static/
        run: python tools/site_sync_assets.py
      - name: Build
        run: zola --root site build
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::976877302614:role/mindfork-site-deploy
          aws-region: us-east-1
      - name: Sync to S3
        run: aws s3 sync site/public/ "s3://$BUCKET" --delete --no-progress
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
