# mindfork.io: a build gate on pull requests, deploy on push to main.
# Design: docs/research/mindfork-io-website.md §5.5; infra (bucket,
# distribution, the OIDC deploy role) comes from the `mindfork-website`
# CloudFormation stack, infra/website.cfn.yaml.
#
# Zola is pinned (ZOLA_VERSION below) and must match local development: the site
# builds with one version everywhere, and 0.23 is a different language from 0.22
# (Tera 2 components instead of shortcodes, content templated). The binary is
# the upstream release asset, verified against its Sigstore/SLSA attestation
# (`gh attestation verify --owner getzola`) rather than installed through a
# third-party manifest that lags new tags by days. Bump here, in
# docs/research/mindfork-io-website.md §5.5 and on the developer machines.
#
# Deploys carry no stored keys: the job's OIDC token assumes the
# least-privilege mindfork-site-deploy role (s3 sync + one invalidation),
# trusted for refs/heads/main of this repository only.
name: Site

env:
  ZOLA_VERSION: "0.23.6"

on:
  pull_request:
    paths:
      - "site/**"
      - "assets/**"
      - "tools/site_sync_assets.py"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/**"
      - "tools/site_sync_assets.py"
      - ".github/workflows/site.yml"
  # Manual redeploy (e.g. after an infra change with no site diff).
  workflow_dispatch:

# Superseded PR builds are cancelled; deploys on main queue and never cancel
# each other mid-sync.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job has a `timeout-minutes` — the reasons, and the incident behind them,
# are in the header of ci.yml. Measured over 35 builds and 20 deploys: max 0.3 min;
# the Zola download, the S3 sync and the invalidation are the network parts.
jobs:
  build:
    name: Build (gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Zola ${{ env.ZOLA_VERSION }} (verified release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${ZOLA_VERSION}" --repo getzola/zola --pattern "$asset" --dir /tmp/zola
          gh attestation verify "/tmp/zola/$asset" --owner getzola
          tar -xzf "/tmp/zola/$asset" -C /tmp/zola
          sudo install -m 755 /tmp/zola/zola /usr/local/bin/zola
          zola --version
      - name: Mirror brand assets into site/static/
        run: python tools/site_sync_assets.py
      - name: Check internal links
        run: zola --root site check --skip-external-links
      - name: Build
        run: zola --root site build

  deploy:
    name: Deploy to mindfork.io
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # the OIDC token that assumes the deploy role
      contents: read
    env:
      # Outputs of the `mindfork-website` stack (infra/website.cfn.yaml).
      BUCKET: mindfork-website-sitebucket-ioafb7vyycso
      DISTRIBUTION: E8EC9ICZSRYKB
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Zola ${{ env.ZOLA_VERSION }} (verified release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${ZOLA_VERSION}" --repo getzola/zola --pattern "$asset" --dir /tmp/zola
          gh attestation verify "/tmp/zola/$asset" --owner getzola
          tar -xzf "/tmp/zola/$asset" -C /tmp/zola
          sudo install -m 755 /tmp/zola/zola /usr/local/bin/zola
          zola --version
      - name: Mirror brand assets into site/static/
        run: python tools/site_sync_assets.py
      - name: Build
        run: zola --root site build
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::976877302614:role/mindfork-site-deploy
          aws-region: us-east-1
      # `Cache-Control` travels with the object: S3 stores it, CloudFront passes
      # it on, and the edge and the browser both obey it. Until this existed the
      # site sent the header on nothing at all - measured on the live pages, the
      # stylesheet, the woff2 fonts and the OG card alike - so every repeat visit
      # re-fetched 2.5 MB of fonts and screenshots on nothing but a heuristic.
      #
      # Three passes because three answers are right, and because the site has no
      # fingerprinted filenames to lean on: `/style.css` is `/style.css` forever,
      # so it cannot be given the long life a hashed asset could. `immutable` is
      # claimed only for the fonts, whose bytes are a released typeface; the
      # brand images and screenshots are regenerated under their own names by
      # `tools/og_card.py` and `tools/screenshots.py`, so a year would strand a
      # viewer on the old one. `s-maxage` lets the edge hold a page for a day
      # while a browser rechecks in five minutes - the deploy invalidates the
      # edge explicitly on the next step, and cannot invalidate a browser.
      #
      # `sync` writes the header only onto the objects it uploads - but from a
      # runner that is every object, every time: a fresh checkout and build give
      # every file a current mtime, and `sync` uploads whatever is newer than the
      # destination whether its bytes changed or not. Measured on the deploy that
      # introduced these passes - all 59 objects rewritten within the same minute,
      # every one carrying its header, so the backfill this change was expected to
      # need turned out unnecessary. docs/journal/website.md has the reasoning,
      # including why a bucket populated some other way would still need one.
      - name: Sync to S3 - fonts
        run: |
          aws s3 sync site/public/ "s3://$BUCKET" --delete --no-progress \
            --exclude "*" --include "fonts/*" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Sync to S3 - brand and screenshots
        run: |
          aws s3 sync site/public/ "s3://$BUCKET" --delete --no-progress \
            --exclude "*" --include "brand/*" --include "screenshots/*" \
            --cache-control "public, max-age=86400"
      - name: Sync to S3 - pages, styles and feeds
        run: |
          aws s3 sync site/public/ "s3://$BUCKET" --delete --no-progress \
            --exclude "fonts/*" --exclude "brand/*" --exclude "screenshots/*" \
            --cache-control "public, max-age=300, s-maxage=86400"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/*"
