# Dependency audit (cargo-deny): vulnerabilities (advisories), licenses, duplicate versions,
# sources. Runs on a schedule (weekly) and manually — NOT on pull_request,
# so it doesn't block merges (advisory mode, release-engineering.md F6). Configuration —
# deny.toml at the repo root.
name: Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
