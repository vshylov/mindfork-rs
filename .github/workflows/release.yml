# Release: on a `vX.Y.Z` tag, builds binaries (Windows + Linux glibc 2.35),
# packs archives + sha256sums.txt, and publishes a GitHub Release with notes from
# the corresponding CHANGELOG.md section. See docs/release-engineering.md §3.5.
#
# The tag is applied by the user after merging the release PR (a version bump + CHANGELOG).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Every job has a `timeout-minutes` and every apt step is bounded — the reasons,
# and the incident behind them, are in the header and the `lint` job of ci.yml.
jobs:
  # Builds the binary on each platform; packaging is centralized in the release job
  # (on Linux both tar and zip are available — avoiding Windows shell differences).
  build:
    name: Build (${{ matrix.artifact }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04       # old glibc 2.35 — the binary works on most distributions
            bin: mindfork-rs
            artifact: linux
          - os: windows-latest
            bin: mindfork-rs.exe
            artifact: windows
    runs-on: ${{ matrix.os }}
    # Measured over the last three releases: Linux 7.8–8.8 min, Windows
    # 14.9–17.9 — LTO release builds, and a tag ref has no warm cache of its
    # own to count on. One budget for both, sized from the Windows figure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # ALSA is only needed by the Linux build (rodio/cpal — speech playback /tts).
      - name: System dependencies (ALSA)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          && sudo apt-get install -y libasound2-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Upload the binary
        uses: actions/upload-artifact@v5
        with:
          name: bin-${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  # Linux packages from the already-built binary (bin-linux) via nfpm.
  linux-packages:
    name: Linux packages (deb/rpm/archlinux)
    needs: build
    runs-on: ubuntu-22.04
    # Measured: 0.5 min on every release so far; the nfpm install is the network part.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Download the Linux binary
        uses: actions/download-artifact@v5
        with:
          name: bin-linux
          path: bin
      - name: Install nfpm
        timeout-minutes: 5
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y nfpm
      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # e.g. v0.9.0 → 0.9.0
          chmod +x bin/mindfork-rs
          bash packaging/linux/build-packages.sh bin/mindfork-rs "$VERSION" dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # The Windows installer (Inno Setup) from the already-built binary (bin-windows).
  windows-installer:
    name: Windows installer (Inno Setup)
    needs: build
    runs-on: windows-latest
    # Measured: 0.6–0.7 min on every release so far; `choco install` is the network part.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download the Windows binary
        uses: actions/download-artifact@v5
        with:
          name: bin-windows
          path: bin
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile the installer
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''   # v0.9.0 → 0.9.0
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=$ver" "/DBinDir=$PWD\bin" packaging\windows\mindfork.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: dist\*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, linux-packages, windows-installer]
    runs-on: ubuntu-22.04
    # Measured: 0.3–0.4 min on every release so far; the asset upload is the network part.
    timeout-minutes: 10
    permissions:
      contents: write        # needed for gh release create
    steps:
      - uses: actions/checkout@v5
      - name: Download the binaries
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Build archives + sha256 + notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"        # e.g. v0.9.0
          VERSION="${TAG#v}"
          mkdir -p dist

          # A shared doc set for every archive.
          # Flattened into the archive root; the two ru files are the
          # translations of the pair above (docs/legal-ru-translations.md).
          DOCS=(README.md CHANGELOG.md LICENSE DISCLAIMER.md docs/install.md
                docs/legal/LICENSE.ru.txt docs/legal/DISCLAIMER.ru.md)

          # Put spellcheck dictionaries into data/dictionaries/ — the portable layout
          # the app reads next to the binary (data/ next to the exe → spellcheck
          # out of the box). See build.rs / shared/paths.rs.
          stage_data() {
            mkdir -p "$1/data/dictionaries"
            cp dictionaries/*.aff dictionaries/*.dic "$1/data/dictionaries/"
          }

          # Linux: tar.gz
          mkdir -p stage-linux
          cp "artifacts/bin-linux/mindfork-rs" stage-linux/
          chmod +x stage-linux/mindfork-rs
          cp "${DOCS[@]}" stage-linux/
          stage_data stage-linux
          tar -C stage-linux -czf "dist/mindfork-rs-${TAG}-x86_64-linux.tar.gz" .

          # Windows: zip
          mkdir -p stage-win
          cp "artifacts/bin-windows/mindfork-rs.exe" stage-win/
          cp "${DOCS[@]}" stage-win/
          stage_data stage-win
          (cd stage-win && zip -qr "../dist/mindfork-rs-${TAG}-x86_64-windows.zip" .)

          # Linux packages (deb/rpm/archlinux) and the Windows installer, built by
          # separate jobs.
          cp artifacts/linux-packages/* dist/
          cp artifacts/windows-installer/* dist/

          # Checksums (over all artifacts: archives + packages + the installer).
          (cd dist && sha256sum ./* > sha256sums.txt)

          # The release notes = the CHANGELOG section for this version (no heading).
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Release ${TAG}." > notes.md
          fi

          # A footer on every release page (appended after the fallback above, so
          # it is present either way). The install guide is pinned to this tag —
          # the instructions travel with the release they describe, unlike a link
          # to main.
          printf '\n---\n\n[mindfork.io](https://mindfork.io) · [Install guide](%s/blob/%s/docs/install.md)\n' \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$TAG" >> notes.md

          echo "Artifacts:"; ls -l dist
          echo "Notes:"; cat notes.md
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "mindfork-rs ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
