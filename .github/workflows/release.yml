# Release: on a `vX.Y.Z` tag, builds binaries (Windows + Linux glibc 2.35),
# packs archives + sha256sums.txt, and publishes a GitHub Release with notes from
# the corresponding CHANGELOG.md section. See docs/release-engineering.md §3.5.
#
# The tag is applied by the user after merging the release PR (a version bump + CHANGELOG).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Every job has a `timeout-minutes` and every apt step is bounded — the reasons,
# and the incident behind them, are in the header and the `lint` job of ci.yml.
jobs:
  # Everything a tag can get wrong, before a runner spends forty minutes on it:
  # its shape, its agreement with `Cargo.toml` (the source of truth for what the
  # binary answers to `--version`), and the `CHANGELOG.md` section that becomes
  # the release page. A prerelease tag (`v0.9.9-rc1`) is allowed and may fall
  # back to `[Unreleased]` — that is what makes a rehearsal of this whole
  # workflow possible without inventing a version
  # (docs/research/release-pipeline.md §6). The guard's own refusals are
  # exercised on every pull request by ci.yml's `lint` job, so they are not first
  # tried out on a release.
  guard:
    name: The tag is a release this repository can make
    runs-on: ubuntu-latest
    # Measured locally: well under a second. The budget is for the checkout.
    timeout-minutes: 5
    outputs:
      version: ${{ steps.guard.outputs.version }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tag against Cargo.toml and the CHANGELOG
        id: guard
        run: python3 tools/release_guard.py --tag "${GITHUB_REF_NAME}"

  # Builds the binary on each platform; packaging is centralized in the release job
  # (on Linux both tar and zip are available — avoiding Windows shell differences).
  build:
    name: Build (${{ matrix.artifact }})
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04       # old glibc 2.35 — the binary works on most distributions
            bin: mindfork
            artifact: linux
          - os: windows-latest
            bin: mindfork.exe
            artifact: windows
    runs-on: ${{ matrix.os }}
    # Measured over the last three releases: Linux 7.8–8.8 min, Windows
    # 14.9–17.9 — LTO release builds, and a tag ref has no warm cache of its
    # own to count on. One budget for both, sized from the Windows figure.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # ALSA is only needed by the Linux build (rodio/cpal — speech playback /tts).
      - name: System dependencies (ALSA)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          && sudo apt-get install -y libasound2-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Upload the binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bin-${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
      # The third-party notice file: the licence texts of every package in the
      # locked graph, which MIT, BSD and Apache all require to travel with a
      # redistribution (docs/research/release-pipeline.md §2.3, R2). Generated
      # from *this* release's `Cargo.lock`, so it cannot describe a different
      # build; every artifact below carries a copy, and packaging.yml runs the
      # same two steps on any pull request that changes the graph, so a licence
      # the list cannot account for fails there rather than here.
      #
      # In this job rather than one of its own: the toolchain and the registry
      # are already warm here, and everything that needs the file already waits
      # for this job. Linux only — the file is identical on both, and the config
      # asks for both targets' graphs (about.toml).
      - name: Install cargo-about
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908  # v2.87.15
        with:
          tool: cargo-about
      - name: Third-party notices
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
      - name: Upload the notices
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.md
          if-no-files-found: error

  # Linux packages from the already-built binary (bin-linux) via nfpm.
  linux-packages:
    name: Linux packages (deb/rpm/archlinux)
    needs: build
    runs-on: ubuntu-22.04
    # Measured: 0.5 min on every release so far; the nfpm install is the network part.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download the Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bin-linux
          path: bin
      # The packages carry the notices too (`/usr/share/doc/mindfork-rs/`), so
      # they wait for the file the build job generated.
      - name: Download the third-party notices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: notices
      # The pinned nfpm, verified by hash — the same script packaging.yml's gate
      # uses, so the two cannot drift onto different builders. It replaced an
      # `apt-get install` from an *unsigned* third-party repository
      # (`deb [trusted=yes]`) at an unnamed version (tools/install_nfpm.sh).
      - name: Install nfpm
        timeout-minutes: 5
        run: bash tools/install_nfpm.sh
      - name: Build packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # e.g. v0.9.0 → 0.9.0
          chmod +x bin/mindfork
          bash packaging/linux/build-packages.sh bin/mindfork "$VERSION" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  # The Windows installer (Inno Setup) from the already-built binary (bin-windows).
  windows-installer:
    name: Windows installer (Inno Setup)
    needs: build
    runs-on: windows-latest
    # Measured: 0.6–0.7 min on every release so far; the compiler download (14 MB) is
    # the network part, and it replaced a `choco install` of comparable weight.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download the Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bin-windows
          path: bin
      # The installer lays the notices down next to the program, so the file has
      # to be at the repository root where mindfork.iss expects it. packaging.yml
      # generates its own copy for the same reason.
      - name: Download the third-party notices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: notices
      # The pinned Inno Setup 7 (hash-verified), the same one packaging.yml's gate
      # uses. $env:ISCC is its absolute path: PATH here still carries the runner
      # image's chocolatey shim for Inno 6, so resolving by name would compile the
      # release with the wrong compiler and say nothing (docs/research/inno-setup-7.md §4).
      - name: Install Inno Setup
        shell: pwsh
        run: ./tools/install_inno.ps1
      - name: Compile the installer
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v', ''   # v0.9.0 → 0.9.0
          & $env:ISCC "/DAppVersion=$ver" "/DBinDir=$PWD\bin" packaging\windows\mindfork.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-installer
          path: dist\*.exe
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [guard, build, linux-packages, windows-installer]
    runs-on: ubuntu-22.04
    # Measured: 0.3–0.4 min on every release so far; the asset upload is the network part.
    timeout-minutes: 10
    permissions:
      contents: write        # needed for gh release create
      # Build provenance (the step at the end of this job): the OIDC token that
      # identifies this workflow run to Sigstore, and the write access that
      # records the attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Download the binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
      - name: Build archives + sha256 + notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"        # e.g. v0.9.0
          mkdir -p dist

          # A shared doc set for every archive.
          # Flattened into the archive root; the three ru files are the
          # translations of their originals (docs/legal-ru-translations.md).
          # PRIVACY.md travels with them: the Windows installer shows it during
          # setup and leaves a copy next to the program, and an archive user
          # should not have to go to the website for the same text.
          # The notices are generated per release from its own Cargo.lock (the
          # `build` job), so they come out of the artifacts rather than the
          # checkout.
          DOCS=(README.md CHANGELOG.md LICENSE DISCLAIMER.md PRIVACY.md docs/install.md
                docs/legal/LICENSE.ru.txt docs/legal/DISCLAIMER.ru.md
                docs/legal/PRIVACY.ru.md
                artifacts/notices/THIRD-PARTY-NOTICES.md)

          # Put spellcheck dictionaries into data/dictionaries/ — the portable layout
          # the app reads next to the binary (data/ next to the exe → spellcheck
          # out of the box). See build.rs / shared/paths.rs.
          stage_data() {
            mkdir -p "$1/data/dictionaries/licenses" "$1/licenses/syntaxes"
            cp dictionaries/*.aff dictionaries/*.dic "$1/data/dictionaries/"
            # The dictionaries are third-party work under BSD-style and LGPL
            # terms, and both require their notices to travel with what is
            # redistributed (dictionaries/SOURCES.md).
            cp dictionaries/licenses/*.txt "$1/data/dictionaries/licenses/"
            # The vendored syntax grammars are compiled into the binary by
            # build.rs, so unlike the dictionaries they have no file of their own
            # to sit beside — and their licences (MIT, BSD, Apache; syntaxes/
            # SOURCES.md) travelled nowhere at all until now. The About dialog
            # names them; this is the text it names.
            cp syntaxes/licenses/*.txt "$1/licenses/syntaxes/"
          }

          # Linux: tar.gz
          mkdir -p stage-linux
          cp "artifacts/bin-linux/mindfork" stage-linux/
          chmod +x stage-linux/mindfork
          cp "${DOCS[@]}" stage-linux/
          stage_data stage-linux
          tar -C stage-linux -czf "dist/mindfork-rs-${TAG}-x86_64-linux.tar.gz" .

          # Windows: zip
          mkdir -p stage-win
          cp "artifacts/bin-windows/mindfork.exe" stage-win/
          cp "${DOCS[@]}" stage-win/
          stage_data stage-win
          (cd stage-win && zip -qr "../dist/mindfork-rs-${TAG}-x86_64-windows.zip" .)

          # Linux packages (deb/rpm/archlinux) and the Windows installer, built by
          # separate jobs.
          cp artifacts/linux-packages/* dist/
          cp artifacts/windows-installer/* dist/

          # Checksums (over all artifacts: archives + packages + the installer).
          (cd dist && sha256sum ./* > sha256sums.txt)

          echo "Artifacts:"; ls -l dist
      # The notes and the footer come from the same guard the `guard` job ran, so
      # the page cannot be assembled by a rule the gate never checked. It refuses
      # here too if the CHANGELOG lost its section between the two jobs.
      - name: Release notes
        run: python3 tools/release_guard.py --tag "${GITHUB_REF_NAME}"
      # Build provenance: a signed statement of which workflow, commit and runner
      # produced each asset, verifiable by anyone with
      # `gh attestation verify <file> --repo ${{ github.repository }}`.
      # Attestations are free on a public repository and unavailable on a private
      # one below Enterprise, so the step is guarded by the repository's own
      # visibility — on the flip it starts working with nothing left to remember
      # (docs/research/release-pipeline.md N3).
      - name: Attest the artifacts
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      # A **draft**: the release page and its assets exist, and nobody outside
      # this repository can see them until the owner presses Publish. That is
      # what makes AGENTS.md §6 step 5 — download the archive, check `--version`,
      # run it on a copy of the data — a check rather than a post-mortem. A tag
      # with a prerelease suffix is additionally marked as one, which is how a
      # rehearsal of this workflow stays distinguishable from a real release.
      - name: Create the GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--draft)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "mindfork-rs ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag "${flags[@]}"
          echo "The release is a DRAFT. Check the artifacts (AGENTS.md §6 step 5)," \
               "then publish it from the releases page."
