# Validates packaging on PRs and pushes to main. Linux: builds packages (deb/rpm/archlinux)
# via nfpm and checks the install in Ubuntu/Fedora/Arch containers (a smoke: the layout +
# running `--version` as a regular user); runs the install script (install.sh) in five
# bare distribution images. Windows: compiles the Inno Setup installer
# script (a syntax check for the .iss + [Code], without building a real binary).
# The real public release builds and attaches artifacts separately — release.yml.
# See docs/history/installers.md §8.
name: Packaging

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packaging.yml"
      # The pinned Inno Setup compiler both this gate and release.yml install:
      # a change to the pin is a change to what compiles the installer.
      - "tools/install_inno.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dictionaries/**"
  # Deliberately no `push: [main]` trigger: the pull_request run validates the
  # merge result for exactly these paths, so a main run would repeat ~9 billable
  # minutes (it builds packages, three container smokes and compiles the .iss on
  # a 2x-billed Windows runner). The real gate for a release is release.yml,
  # which builds the packages for real; `workflow_dispatch` covers a manual check.
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every job has a `timeout-minutes` and every apt step is bounded — the reasons,
# and the incident behind them, are in the header and the `lint` job of ci.yml.
jobs:
  build:
    name: Build packages
    runs-on: ubuntu-22.04  # glibc 2.35 — the binary works on most distributions
    # Measured over 26 runs: p50 5.0 min, max 10.0 — a release build with LTO,
    # usually from a warm cache; cold adds several minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
      # ALSA is needed by the Linux build (rodio/cpal — speech playback /tts).
      - name: System dependencies (ALSA)
        timeout-minutes: 5
        run: >-
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          && sudo apt-get install -y libasound2-dev
      - name: Release build
        run: cargo build --release --locked
      # The same pinned, hash-verified nfpm release.yml builds the real packages
      # with — one script, so this gate cannot pass on a different builder
      # (tools/install_nfpm.sh).
      - name: Install nfpm
        timeout-minutes: 5
        run: bash tools/install_nfpm.sh
      # The packages carry the third-party notices, and this workflow triggers on
      # `Cargo.toml`/`Cargo.lock` — so the generation that a release depends on is
      # exercised by the pull request that changes the graph. A dependency whose
      # licence the list cannot account for fails here, not on the tag
      # (docs/research/release-pipeline.md R2).
      - name: Install cargo-about
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908  # v2.87.15
        with:
          tool: cargo-about
      - name: Third-party notices
        timeout-minutes: 10
        run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
      - name: Build deb/rpm/archlinux
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          bash packaging/linux/build-packages.sh target/release/mindfork "$VERSION" dist
      # The install script is shell, and shell has no compiler to tell it about a
      # quoting slip. `warning` and up: the style notes are not what this is for.
      - name: shellcheck the install script
        run: shellcheck --severity=warning packaging/linux/install.sh packaging/linux/install_test.sh
      # A portable archive shaped like release.yml's — flat, with a sha256sums.txt
      # that spells names `./name` — for the `install-script` job to install with
      # `--from`. The bare binary rides along as the scenarios' `BIN`.
      - name: Portable archive for the install-script job
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          mkdir -p portable/stage/data/dictionaries
          cp target/release/mindfork portable/stage/
          cp dictionaries/*.aff dictionaries/*.dic portable/stage/data/dictionaries/
          tar -C portable/stage -czf "portable/mindfork-rs-v${VERSION}-x86_64-linux.tar.gz" .
          rm -rf portable/stage
          (cd portable && sha256sum ./*.tar.gz > sha256sums.txt)
          cp target/release/mindfork portable/mindfork-bin
          ls -l portable
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: portable-archive
          path: portable/
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  smoke:
    name: Install smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    # Measured over 26 runs each: max 0.8 min. The image pull and the distro's
    # own package fetch are network; the budget is for those.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: linux-packages
          path: dist
      - name: Install the package and check the layout
        shell: sh
        run: |
          set -eu
          # Install with the appropriate manager, by which binary is present.
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            # desktop-file-utils provides desktop-file-validate — checking the menu entry.
            apt-get install -y ./dist/*.deb desktop-file-utils
          elif command -v dnf >/dev/null 2>&1; then
            # util-linux provides `su` (absent in the minimal fedora:latest) — needed
            # below to launch as a regular user.
            dnf install -y util-linux desktop-file-utils ./dist/*.rpm
          elif command -v pacman >/dev/null 2>&1; then
            # `pacman -U` does NOT pull dependencies from repositories (unlike apt/dnf),
            # so we install the runtime dependencies ourselves: alsa-lib is needed for speech
            # playback (`/tts`) — the binary links against libasound.
            pacman -Sy --noconfirm alsa-lib
            pacman -U --noconfirm ./dist/*.pkg.tar.zst
          else
            echo "no supported package manager"; exit 1
          fi

          # Layout: the real binary + defaults.json + dictionaries in /usr/lib/<pkg>/.
          test -f /usr/lib/mindfork-rs/mindfork
          test -f /usr/lib/mindfork-rs/defaults.json
          test -d /usr/lib/mindfork-rs/data/dictionaries
          ls /usr/lib/mindfork-rs/data/dictionaries/*.dic >/dev/null

          # The symlink from PATH resolves to the real binary → defaults.json is visible next to it.
          real="$(readlink -f /usr/bin/mindfork)"
          test "$real" = /usr/lib/mindfork-rs/mindfork
          test -f "$(dirname "$real")/defaults.json"
          grep -q '"mode"' /usr/lib/mindfork-rs/defaults.json

          # The application-menu entry and theme icons (docs/branding.md §4.2).
          desktop=/usr/share/applications/mindfork.desktop
          test -f "$desktop"
          # Terminal=true is critical: without it, launching from the menu gives no terminal.
          grep -q '^Terminal=true$' "$desktop"
          grep -q '^Exec=mindfork$' "$desktop"
          grep -q '^Icon=mindfork$' "$desktop"
          # The icon file name must match the Icon= key.
          for size in 16x16 32x32 48x48 64x64 128x128 256x256; do
            test -f "/usr/share/icons/hicolor/$size/apps/mindfork.png"
          done
          test -f /usr/share/icons/hicolor/scalable/apps/mindfork.svg

          # The standard validator — if present in the image (won't install it just for this).
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$desktop"
            echo "desktop-file-validate: OK"
          else
            echo "desktop-file-validate is absent — skipping"
          fi

          # Launch as a regular (non-root) user: the binary is executable, resources are
          # readable. `--version` — the peek phase, creates no data directories.
          if command -v useradd >/dev/null 2>&1; then
            useradd -m tester
            su tester -c 'mindfork --version'
          else
            mindfork --version
          fi
          echo "SMOKE OK: ${{ matrix.image }}"

  # install.sh in the images it is written for: a bare distribution with no
  # curl, no ALSA and `dash` for a shell. Three things a unit test cannot say —
  # that each package manager's branch really brings the app up, that Ubuntu
  # 22.04 takes the `libasound2` fallback where 24.04 takes `libasound2t64`, and
  # that the download path works against a published release.
  install-script:
    name: install.sh (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.image }}
    steps:
      # Before the checkout: without git it unpacks a tarball, and a minimal image
      # may not even have `tar`. curl is for the download scenario only — the
      # script itself is content with wget, and with neither under `--from`.
      - name: What the image lacks (tar, gzip, curl, certificates)
        shell: sh
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1; then
            apt-get -o Acquire::Retries=3 update -qq
            apt-get install -y -qq --no-install-recommends tar gzip curl ca-certificates
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y -q tar gzip curl
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Sy --noconfirm --needed tar gzip curl
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: portable-archive
          path: portable
      - name: Scenarios (no network needed)
        shell: sh
        run: |
          set -eu
          chmod +x portable/mindfork-bin
          BIN="$PWD/portable/mindfork-bin" sh packaging/linux/install_test.sh
      # The real thing: the script finds the app cannot start, installs the
      # distribution's ALSA package itself, links the binary, runs it.
      - name: Install from the archive, dependencies and all
        shell: sh
        run: |
          set -eu
          sh packaging/linux/install.sh --from portable --dir /opt/mindfork -- --version
          test "$(readlink /usr/local/bin/mindfork)" = /opt/mindfork/mindfork
          mindfork --version
          # The line a restarted container runs: nothing is unpacked twice.
          sh packaging/linux/install.sh --from portable --dir /opt/mindfork | tee again.log
          grep -q "already installed" again.log
      # The download path, end to end, against whatever release is the latest:
      # the redirect, the archive, its sha256sums.txt, the verification.
      - name: Install the latest published release from the network
        shell: sh
        run: |
          set -eu
          sh packaging/linux/install.sh --dir /opt/released --no-link -- --version | tee released.log
          grep -q "sha256 ok" released.log
          grep -Eq "^mindfork [0-9]+\.[0-9]+\.[0-9]+" released.log

  windows-installer:
    name: Windows installer (compile .iss)
    runs-on: windows-latest
    # Measured over 26 runs: max 0.9 min; the compiler download (14 MB) is the network
    # part, and it replaced a `choco install` of comparable weight.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The same pinned compiler release.yml compiles the real artifact with — shared
      # through one script so the gate cannot drift onto a different Inno Setup than
      # the release (docs/research/inno-setup-7.md §4).
      - name: Install Inno Setup
        shell: pwsh
        run: ./tools/install_inno.ps1
      - name: Stub binary + compile the installer
        shell: pwsh
        run: |
          # We don't build a real binary here — we only check that the .iss (and its
          # Pascal code) compiles. The stubs satisfy [Files]: the binary, and the
          # notice file that the release generates from its own Cargo.lock (the
          # `build` job above does generate the real one, but this job runs on a
          # different machine and the gate is about the script, not the text).
          New-Item -ItemType Directory -Force stage | Out-Null
          Set-Content -Path stage\mindfork.exe -Value "dummy"
          Set-Content -Path THIRD-PARTY-NOTICES.md -Value "stub"
          & $env:ISCC "/DAppVersion=0.0.0" "/DBinDir=$PWD\stage" packaging\windows\mindfork.iss
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: windows-installer-ci
          path: dist\*.exe
          if-no-files-found: error
