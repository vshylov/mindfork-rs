# Validates packaging on PRs and pushes to main. Linux: builds packages (deb/rpm/archlinux)
# via nfpm and checks the install in Ubuntu/Fedora/Arch containers (a smoke: the layout +
# running `--version` as a regular user). Windows: compiles the Inno Setup installer
# script (a syntax check for the .iss + [Code], without building a real binary).
# The real public release builds and attaches artifacts separately — release.yml.
# See docs/history/installers.md §8.
name: Packaging

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/packaging.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "dictionaries/**"
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

concurrency:
  group: packaging-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-22.04  # glibc 2.35 — the binary works on most distributions
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # ALSA is needed by the Linux build (rodio/cpal — speech playback /tts).
      - name: System dependencies (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Release build
        run: cargo build --release --locked
      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
      - name: Build deb/rpm/archlinux
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          bash packaging/linux/build-packages.sh target/release/mindfork-rs "$VERSION" dist
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error

  smoke:
    name: Install smoke (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:latest
          - archlinux:latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: linux-packages
          path: dist
      - name: Install the package and check the layout
        shell: sh
        run: |
          set -eu
          # Install with the appropriate manager, by which binary is present.
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            # desktop-file-utils provides desktop-file-validate — checking the menu entry.
            apt-get install -y ./dist/*.deb desktop-file-utils
          elif command -v dnf >/dev/null 2>&1; then
            # util-linux provides `su` (absent in the minimal fedora:latest) — needed
            # below to launch as a regular user.
            dnf install -y util-linux desktop-file-utils ./dist/*.rpm
          elif command -v pacman >/dev/null 2>&1; then
            # `pacman -U` does NOT pull dependencies from repositories (unlike apt/dnf),
            # so we install the runtime dependencies ourselves: alsa-lib is needed for speech
            # playback (`/tts`) — the binary links against libasound.
            pacman -Sy --noconfirm alsa-lib
            pacman -U --noconfirm ./dist/*.pkg.tar.zst
          else
            echo "no supported package manager"; exit 1
          fi

          # Layout: the real binary + defaults.json + dictionaries in /usr/lib/<pkg>/.
          test -f /usr/lib/mindfork-rs/mindfork-rs
          test -f /usr/lib/mindfork-rs/defaults.json
          test -d /usr/lib/mindfork-rs/data/dictionaries
          ls /usr/lib/mindfork-rs/data/dictionaries/*.dic >/dev/null

          # The symlink from PATH resolves to the real binary → defaults.json is visible next to it.
          real="$(readlink -f /usr/bin/mindfork-rs)"
          test "$real" = /usr/lib/mindfork-rs/mindfork-rs
          test -f "$(dirname "$real")/defaults.json"
          grep -q '"mode"' /usr/lib/mindfork-rs/defaults.json

          # The application-menu entry and theme icons (docs/branding.md §4.2).
          desktop=/usr/share/applications/mindfork-rs.desktop
          test -f "$desktop"
          # Terminal=true is critical: without it, launching from the menu gives no terminal.
          grep -q '^Terminal=true$' "$desktop"
          grep -q '^Exec=mindfork-rs$' "$desktop"
          grep -q '^Icon=mindfork-rs$' "$desktop"
          # The icon file name must match the Icon= key.
          for size in 16x16 32x32 48x48 64x64 128x128 256x256; do
            test -f "/usr/share/icons/hicolor/$size/apps/mindfork-rs.png"
          done
          test -f /usr/share/icons/hicolor/scalable/apps/mindfork-rs.svg

          # The standard validator — if present in the image (won't install it just for this).
          if command -v desktop-file-validate >/dev/null 2>&1; then
            desktop-file-validate "$desktop"
            echo "desktop-file-validate: OK"
          else
            echo "desktop-file-validate is absent — skipping"
          fi

          # Launch as a regular (non-root) user: the binary is executable, resources are
          # readable. `--version` — the peek phase, creates no data directories.
          if command -v useradd >/dev/null 2>&1; then
            useradd -m tester
            su tester -c 'mindfork-rs --version'
          else
            mindfork-rs --version
          fi
          echo "SMOKE OK: ${{ matrix.image }}"

  windows-installer:
    name: Windows installer (compile .iss)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Stub binary + compile the installer
        shell: pwsh
        run: |
          # We don't build a real binary here — we only check that the .iss (and its
          # Pascal code) compiles. The stub satisfies [Files].
          New-Item -ItemType Directory -Force stage | Out-Null
          Set-Content -Path stage\mindfork-rs.exe -Value "dummy"
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "/DAppVersion=0.0.0" "/DBinDir=$PWD\stage" packaging\windows\mindfork.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer-ci
          path: dist\*.exe
          if-no-files-found: error
