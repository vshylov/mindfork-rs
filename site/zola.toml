# mindfork.io — site configuration (Zola 0.23.x; the version is pinned in
# .github/workflows/site.yml and must match the local install — the site has to
# build with one version everywhere).
# Track/design doc: docs/research/mindfork-io-website.md
#
# Since 0.23 every page's markdown is itself a Tera template: `{{ config.extra.x }}`
# works in content, the reusable pieces are Tera 2 components in
# templates/components.html, and a literal `{{` or `{%` in a post must sit inside
# `{% raw %}…{% endraw %}` or the build fails on it.

base_url = "https://mindfork.io"
title = "mindfork"
description = "A terminal AI chat written in Rust: local models via llama.cpp or OpenAI, Anthropic, Gemini and Grok in the cloud — with persistent memory, notes, RAG and tools. Windows and Linux."
default_language = "en"

compile_sass = true
build_search_index = false
generate_feeds = true
feed_filenames = ["atom.xml"]

[markdown]

[markdown.highlighting]
theme = "catppuccin-mocha"

[extra]
tagline = "TUI · RUST · LOCAL LLM"
github = "https://github.com/vshylov/mindfork-rs"
releases = "https://github.com/vshylov/mindfork-rs/releases"
# The application version the prose describes — the overview reads it as
# `config.extra.app_version`; bumped by the release PR, AGENTS.md §6.
app_version = "0.10.1"
