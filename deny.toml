# Конфигурация cargo-deny (advisory-аудит зависимостей). Прогон — workflow `audit.yml`
# (еженедельно + вручную, не на PR → merge не блокирует). См. release-engineering.md Ф6.
# Allow-список лицензий выверен прогоном `cargo deny check licenses` на текущем графе.

[advisories]
# База RustSec: уязвимости/unmaintained → ошибка (сигнал разобраться), yanked → warn.
yanked = "warn"
# Известные транзитивные advisory без доступного фикса — все приходят из `syntect`
# (подсветка кода): он парсит **свои вшитые** синтаксисы/темы, не ввод пользователя,
# поэтому DoS-риск для нас не реализуется. Снять, когда syntect обновит эти зависимости
# (или при замене syntect). Аудит остаётся зелёным на известном наборе и краснеет на НОВЫХ.
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust unmaintained (syntect)
    "RUSTSEC-2025-0141", # bincode unmaintained (syntect)
    # quick-xml DoS-advisory. Крейт в графе через syntect (свои вшитые темы/синтаксисы,
    # не ввод) И напрямую — разбор `word/document.xml` при индексации DOCX (`/rag add`,
    # doc_extract.rs). Риск неактуален: приложение — локальный однопользовательский
    # инструмент, DOCX добавляет сам пользователь из своих файлов; худший случай —
    # замедленная индексация специально скрафченного пользователем же документа
    # (best-effort, сбой одного файла лишь пропускается). Снять при обновлении quick-xml.
    "RUSTSEC-2026-0194", # quick-xml quadratic-time на дублирующихся атрибутах
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace-alloc DoS
    # ttf-parser объявлен автором unmaintained (RUSTSEC-2026-0192, безопасного апгрейда
    # нет). Это advisory о заброшенности, не уязвимость (не RCE/порча памяти). Приходит
    # транзитивно из pdf-extract → lopdf (чтение шрифтов при извлечении текста из PDF,
    # `/rag add`); используется на локальных файлах самого пользователя (best-effort).
    # Снять при переходе pdf-extract/lopdf на поддерживаемый парсер шрифтов (skrifa).
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (pdf-extract → lopdf)
]

[licenses]
# Разрешённые SPDX-лицензии зависимостей. Всё вне списка → ошибка аудита.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Дубли версий одного крейта — предупреждение, не ошибка (норма для большого графа).
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Все зависимости — из crates.io; сторонние реестры/git — ошибка.
unknown-registry = "deny"
unknown-git = "deny"
