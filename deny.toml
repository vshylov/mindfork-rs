# cargo-deny configuration (a dependency advisory audit). Run by the `audit.yml` workflow
# (weekly + manually, not on a PR → doesn't block merges). See release-engineering.md F6.
# The license allowlist was verified by running `cargo deny check licenses` against the current graph.

[advisories]
# The RustSec database: vulnerabilities/unmaintained → an error (a signal to look into it), yanked → warn.
yanked = "warn"
# Known transitive advisories with no available fix — all come from `syntect`
# (code highlighting): it parses **its own built-in** syntaxes/themes, not user input,
# so the DoS risk doesn't materialize for us. Remove once syntect updates these dependencies
# (or syntect is replaced). The audit stays green on the known set and turns red on NEW ones.
ignore = [
    "RUSTSEC-2024-0320", # yaml-rust unmaintained (syntect)
    "RUSTSEC-2025-0141", # bincode unmaintained (syntect)
    # A quick-xml DoS advisory. The crate is in the graph via syntect (its own built-in
    # themes/syntaxes, not input) AND directly — parsing `word/document.xml` when indexing a DOCX (`/rag add`,
    # doc_extract.rs). The risk doesn't apply: the app is a local single-user
    # tool, DOCX files are added by the user themselves from their own files; the worst case is
    # slowed-down indexing of a document the same user deliberately crafted
    # (best effort, one file's failure is simply skipped). Remove when quick-xml is updated.
    "RUSTSEC-2026-0194", # quick-xml quadratic-time on duplicate attributes
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace-alloc DoS
    # ttf-parser is declared unmaintained by its author (RUSTSEC-2026-0192, no safe upgrade
    # available). This is an advisory about abandonment, not a vulnerability (not RCE/memory
    # corruption). Comes in transitively via pdf-extract → lopdf (reading fonts when extracting text from a PDF,
    # `/rag add`); used on the user's own local files (best effort).
    # Remove once pdf-extract/lopdf moves to a maintained font parser (skrifa).
    "RUSTSEC-2026-0192", # ttf-parser unmaintained (pdf-extract → lopdf)
]

[licenses]
# Allowed SPDX licenses for dependencies. Anything outside the list → an audit error.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of the same crate — a warning, not an error (normal for a large graph).
multiple-versions = "warn"
wildcards = "allow"

[sources]
# All dependencies — from crates.io; third-party registries/git — an error.
unknown-registry = "deny"
unknown-git = "deny"
