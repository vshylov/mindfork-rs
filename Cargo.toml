[package]
name = "mindfork-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
async-trait = "0.1.89"
bytemuck = "1.25.0"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
eventsource-stream = "0.2.3"
futures-util = "0.3.32"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "form"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
single-instance = "0.3.3"
spellbook = "0.4.2"
sqlite-vec = "0.1.9"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util", "rt"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-markdown = "0.3.7"
tui-scrollview = "0.6.5"
uuid = { version = "1.23.3", features = ["v4", "v5", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"

# Релизный профиль (Windows + Linux): оптимизация размера/скорости.
# panic=unwind сохранён намеренно — нужны drop-guard/panic-hook для восстановления
# терминала при панике (ratatui::init ставит hook; M0).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
