[package]
name = "mindfork-rs"
version = "0.9.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/vshylov/mindfork-rs"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.103"
# Буфер обмена (Windows + Linux). `default-features = false` отключает image-data
# (тянет крейт `image`): нам нужен только текст. См. копирование переписки чата.
arboard = { version = "3.4.1", default-features = false }
async-stream = "0.3.6"
async-trait = "0.1.89"
bytemuck = "1.25.0"
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
# Стандартные ОС-папки для непортабельного режима хранения данных
# (Windows %APPDATA%\mindfork-rs, Linux ~/.local/share/mindfork-rs). См. shared/paths.rs.
directories = "6.0.0"
eventsource-stream = "0.2.3"
# Распаковка архива `wasmer` (tar.gz) в `mindfork sandbox setup` (Фаза 2 песочницы
# Python). flate2 — чистый Rust (miniz_oxide, без C-зависимостей), tar — чистый Rust.
flate2 = "1.0"
futures-util = "0.3.32"
# Рендер ```mermaid-блоков ленты в Unicode/ASCII-графику (flowchart/sequence,
# whitelist + жёсткий фолбэк на исходник). Чистый Rust (net-new только ascii-dag);
# ≥0.56.1 обязательно — 0.56.0 паниковал/портил подписи на кириллице (наш апстрим-фикс,
# leboiko/markdown-reader#29/#30). См. docs/research/mermaid-ascii-rendering.md.
mermaid-text = "0.56.1"
# Извлечение текста из PDF для индексации в RAG (`/rag add`, этап B1b). Чистый Rust
# (lopdf + парсеры шрифтов/CFF/CMap, без C-зависимостей); качество извлечения
# «лучшее усилие» — сканированный/картиночный PDF даёт пустой текст, это допустимо.
# См. features/doc_extract.rs, docs/rag-sources-retrieval.md §B1b.
pdf-extract = "0.12.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
# Разбор `word/document.xml` внутри DOCX для индексации в RAG (`/rag add`, этап B1b).
# Уже в графе транзитивно (через syntect → plist); версия пришпилена к той, что в
# Cargo.lock, чтобы не плодить дубль. См. features/doc_extract.rs.
quick-xml = "0.39.4"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls", "form"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Проверка целостности (sha256) скачанных ассетов песочницы (Фаза 2). Чистый Rust.
sha2 = "0.10"
single-instance = "0.3.3"
spellbook = "0.4.2"
sqlite-vec = "0.1.9"
# Определение языка по локали ОС при свежей установке (нет defaults.json/settings.json).
# Кросс-платформенный (Windows/Linux), чистый Rust. См. shared/i18n::detect_os_language.
sys-locale = "0.3"
syntect = "5.3.0"
# Распаковка tar-архива `wasmer` (см. flate2 выше). Чистый Rust.
tar = "0.4"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util", "rt"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tui-scrollview = "0.6.5"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.23.3", features = ["v4", "v5", "serde"] }
# Резервное копирование/восстановление пользовательских данных (zip-архив с
# настраиваемой степенью сжатия deflate). default-features=false отключает bzip2/zstd
# (нативные C-зависимости) — нужен только deflate + store. См. features/backup.rs.
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }

# OS-level лимит памяти песочницы Python через Windows Job Object
# (`JOB_OBJECT_LIMIT_PROCESS_MEMORY`) — защита хоста от OOM при рантайм-скрипте.
# Только Windows: на Unix rlimit ненадёжен с бэкендом V8 (он резервирует большое
# виртуальное адресное пространство). См. ADR 0005 / features/tools/python.rs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"
# `test-util` включает паузу/перемотку виртуального времени tokio в тестах
# (`start_paused`) — детерминированные тесты дебаунса рестарта серверов без
# реального ожидания. Только для тест-сборок (feature unification dev-deps).
tokio = { version = "1.52.3", features = ["test-util"] }

# Релизный профиль (Windows + Linux): оптимизация размера/скорости.
# panic=unwind сохранён намеренно — нужны drop-guard/panic-hook для восстановления
# терминала при панике (ratatui::init ставит hook; M0).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
