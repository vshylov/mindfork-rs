<text xml:space="preserve" y="61.44"><tspan x="24" fill="#6e7580">│</tspan><tspan x="33.6" textLength="19.2">▌ </tspan><tspan x="52.8" textLength="96" fill="#dcaf61">About me: </tspan><tspan x="148.8" textLength="979.2">I run locally and help with practical engineering — model sizing, Rust, the occasional trip plan. I   </tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<rect x="33.6" y="66.24" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="82.56"><tspan x="24" fill="#6e7580">│</tspan><tspan x="33.6" textLength="1094.4">▌ prefer measured numbers to adjectives, and I write things down: advice should start from remembered facts, not  </tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<rect x="33.6" y="87.36" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="103.68"><tspan x="24" fill="#6e7580">│</tspan><tspan x="33.6" textLength="1094.4">▌ fresh guesses.                                                                                                  </tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="124.8"><tspan x="24" fill="#6e7580">│</tspan><tspan x="52.8" textLength="19.2" fill="#6fc082">● </tspan><tspan x="72" textLength="739.2">Answer sizing questions from saved notes alone — no re-asking about hardware.</tspan><tspan x="830.4" textLength="115.2" fill="#7e848b">[2026-07-22]</tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="145.92"><tspan x="24" fill="#6e7580">│</tspan><tspan x="52.8" textLength="19.2" fill="#6fc082">● </tspan><tspan x="72" textLength="720">Keep recommendations reproducible: name the exact quant, context and flags.</tspan><tspan x="811.2" textLength="115.2" fill="#7e848b">[2026-07-25]</tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="167.04"><tspan x="24" fill="#6e7580">│</tspan><tspan x="52.8" textLength="19.2" fill="#7e848b">✓ </tspan><tspan x="72" textLength="537.6">Index the llama.cpp server docs into the knowledge base.</tspan><tspan x="628.8" textLength="115.2" fill="#7e848b">[2026-07-19]</tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="188.16"><tspan x="24" fill="#6e7580">│</tspan><tspan x="62.4" text-anchor="middle" fill="#7e848b">＋</tspan><tspan x="81.6" textLength="76.8" fill="#7e848b">add goal</tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="209.28"><tspan x="24" fill="#6e7580">│</tspan><tspan x="1128" fill="#6e7580">│</tspan></text>
