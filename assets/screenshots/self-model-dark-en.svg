<rect width="100%" height="100%" fill="#0f1115"/>
<text xml:space="preserve" y="26.32"><tspan x="10" fill="#6e7580">╭</tspan><tspan x="34" text-anchor="middle">✦</tspan><tspan x="48.4" textLength="105.6">Self-model </tspan><tspan x="154" textLength="969.6" fill="#6e7580">────────────────────────────────────────────────────────────────────────────────────────────────────╮</tspan></text>
<text xml:space="preserve" y="47.44"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="86.4" class="b" fill="#dcaf61">Assistant</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="68.56"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<rect x="19.6" y="73.36" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="89.68"><tspan x="10" fill="#6e7580">│</tspan><tspan x="19.6" textLength="19.2">▌ </tspan><tspan x="38.8" textLength="96" fill="#dcaf61">About me: </tspan><tspan x="134.8" textLength="979.2">I run locally and help with practical engineering — model sizing, Rust, the occasional trip plan. I   </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<rect x="19.6" y="94.48" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="110.8"><tspan x="10" fill="#6e7580">│</tspan><tspan x="19.6" textLength="1094.4">▌ prefer measured numbers to adjectives, and I write things down: advice should start from remembered facts, not  </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<rect x="19.6" y="115.6" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="131.92"><tspan x="10" fill="#6e7580">│</tspan><tspan x="19.6" textLength="1094.4">▌ fresh guesses. The current thread is fitting Gemma 4 onto a 12 GB card without giving up context; the next      </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<rect x="19.6" y="136.72" width="1094.4" height="21.12" fill="#21242a"/>
<text xml:space="preserve" y="153.04"><tspan x="10" fill="#6e7580">│</tspan><tspan x="19.6" textLength="1094.4">▌ experiment on the list is a 1B draft for speculative decoding.                                                  </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="174.16"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="195.28"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="19.2" fill="#6fc082">● </tspan><tspan x="58" textLength="739.2">Answer sizing questions from saved notes alone — no re-asking about hardware.</tspan><tspan x="816.4" textLength="115.2" fill="#7e848b">[2026-07-22]</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="216.4"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="19.2" fill="#6fc082">● </tspan><tspan x="58" textLength="720">Keep recommendations reproducible: name the exact quant, context and flags.</tspan><tspan x="797.2" textLength="115.2" fill="#7e848b">[2026-07-25]</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="237.52"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="19.2" fill="#6fc082">● </tspan><tspan x="58" textLength="681.6">Measure the 1B draft's speedup and save the number, not the impression.</tspan><tspan x="758.8" textLength="115.2" fill="#7e848b">[2026-07-31]</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="258.64"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="19.2" fill="#7e848b">✓ </tspan><tspan x="58" textLength="537.6">Index the llama.cpp server docs into the knowledge base.</tspan><tspan x="614.8" textLength="115.2" fill="#7e848b">[2026-07-19]</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="279.76"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="19.2" fill="#7e848b">✓ </tspan><tspan x="58" textLength="585.6">Turn the October trip research into a packing-checklist note.</tspan><tspan x="662.8" textLength="115.2" fill="#7e848b">[2026-07-21]</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="300.88"><tspan x="10" fill="#6e7580">│</tspan><tspan x="48.4" text-anchor="middle" fill="#7e848b">＋</tspan><tspan x="67.6" textLength="76.8" fill="#7e848b">add goal</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="322"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="343.12"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="38.4" class="b" fill="#dcaf61">User</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="364.24"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="385.36"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="76.8" fill="#dcaf61">Traits: </tspan><tspan x="115.6" textLength="998.4">methodical, impatient with vague answers, allergic to hand-waving                                       </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="406.48"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="427.6"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="105.6" fill="#dcaf61">Interests: </tspan><tspan x="144.4" textLength="969.6">local model tuning, terminal tooling, speculative decoding                                           </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="448.72"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="469.84"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="134.4" fill="#dcaf61">Relationship: </tspan><tspan x="173.2" textLength="940.8">Collaborative and direct; jokes land better after the numbers.                                    </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="490.96"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="512.08"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="153.6" class="b" fill="#dcaf61">Observations (6)</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="533.2"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="554.32"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="124.8" fill="#7e848b">[2026-08-01] </tspan><tspan x="163.6" textLength="950.4">Showing the exact command I ran turns out to be the fastest way to build trust.                    </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="575.44"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="596.56"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="124.8" fill="#7e848b">[2026-07-30] </tspan><tspan x="163.6" textLength="950.4">Answers that cite the note they came from get fewer follow-ups — receipts beat repetition.         </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="617.68"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="638.8"><tspan x="10" fill="#6e7580">│</tspan><tspan x="38.8" textLength="124.8" fill="#7e848b">[2026-07-28] </tspan><tspan x="163.6" textLength="950.4">The 12 GB VRAM budget keeps coming up — saved it as a note so I stop re-asking.                    </tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="659.92"><tspan x="10" fill="#6e7580">│</tspan><tspan x="1114" fill="#6e7580">│</tspan></text>
<text xml:space="preserve" y="681.04"><tspan x="10" textLength="1113.6" fill="#6e7580">╰──────────────────────────────────────────────────────────────────────────────────────────────────────────────────╯</tspan></text>
